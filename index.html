<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour François</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1f2937;
    }

    .card {
      max-width: 560px;
      width: 100%;
      padding: 48px 40px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      color: #4c1d95;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 28px;
    }

    .bouton {
      display: inline-block;
      padding: 12px 28px;
      background: #667eea;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      transition: transform 0.2s, background 0.2s;
    }

    .bouton:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Bonjour François</h1>
    <p>Bienvenue sur votre nouvelle page d'accueil. Elle est simple, claire et prête à être personnalisée selon vos envies.</p>
    <a class="bouton" href="#">Commencer</a>
  </main>
</body>
</html>
